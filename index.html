<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="tu-blog-proyecto-modulo-1" />
    <meta name="author" content="nairPaez-samiraCarrera" />
    <link
      rel="shortcut icon"
      href="./img/LOGO-TU-BLOG-negro.jpg"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Tu Blog</title>
  </head>
  <body>
    <header class="fixed-top">
      <nav class="navbar navbar-expand-lg bg-black px-md-5">
        <div class="container-fluid">
          <a class="navbar-brand text-light" href="./index.html">Tu Blog</a>
          <a href="./index.html" class="me-auto"
            ><img
              src="./img/LOGO-TU-BLOG-BLACO.jpg"
              alt="logo-tu-blog"
              class="logo-tu-blog-nav"
          /></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto gap-3 row-gap-0 mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link text-light active"
                  aria-current="page"
                  href="./page/acerca-de-nosotros.html"
                  >Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-light opacity-75"
                  href="./page/contacto.html"
                  >Contacto</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-light opacity-75"
                  href="./page/login.html"
                  >Login</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-light opacity-75"
                  href="./page/suscripcion.html"
                  >Registrarse</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
        <section id="carouselCryptoApp" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselCryptoApp"
            data-bs-slide-to="0"
            class="active bg-light"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselCryptoApp"
            data-bs-slide-to="1"
            aria-label="Slide 2"
            class="bg-light"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselCryptoApp"
            data-bs-slide-to="2"
            aria-label="Slide 3"
            class="bg-light"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="./img/banner-slider.jfif"
              alt="noticias-global"
            />
            <div class="carousel-caption d-none d-md-block bg-light text-black bg-opacity-25 rounded">
              <h5>TU BLOG</h5>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="./img/banner-slider-2.jfif"
              alt="noticias-black"
            />
            <div class="carousel-caption d-none d-md-block bg-light text-light bg-opacity-10 rounded">
              <h5>TU BLOG</h5>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="./img/banner-slider-3.jfif"
              alt="noticias-clasificadas"
            />
           <div class="carousel-caption d-none d-md-block bg-light text-light bg-opacity-10 rounded">
              <h5>TU BLOG</h5>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselCryptoApp"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselCryptoApp"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
