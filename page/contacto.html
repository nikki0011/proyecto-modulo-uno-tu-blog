<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="tu-blog-proyecto-modulo-1" />
    <meta name="author" content="nairPaez-samiraCarrera" />
    <link
      rel="shortcut icon"
      href="../img/LOGO-TU-BLOG-BLACO.jpg"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Tu-Blog-Contacto</title>
  </head>
  <body>
    <header class="fixed-top">
      <nav class="navbar navbar-expand-lg bg-black px-md-5">
        <div class="container-fluid">
          <a class="navbar-brand text-light" href="../index.html">Tu Blog</a>
          <a href="../index.html" class="me-auto"
            ><img
              src="../img/LOGO-TU-BLOG-BLACO.jpg"
              alt="logo-tu-blog"
              class="logo-tu-blog-nav"
          /></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto gap-3 row-gap-0 mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link text-light opacity-75"
                  aria-current="page"
                  href="./acerca-de-nosotros.html"
                  >Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-light active" href="./contacto.html"
                  >Contacto</a
                >
              </li>
              <li class="nav-item opacity-75">
                <a class="nav-link text-light" href="./login.html">Login</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-light opacity-75"
                  href="./suscripcion.html"
                  >Registrarse</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="mt-5">
      <div class="container my-4">
        <div class="row">
          <h1 class="display-5 fw-bold mb-5 text-center">CONTACTO</h1>
          <div class="col-12 col-md-6 mb-5 mb-md-0">
            <form>
              <div class="mb-3">
                <label for="email" class="form-label"
                  >Correo Electrónico:</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  aria-describedby="emailHelp"
                  minlength="1"
                  maxlength="60"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="consulta" class="form-label"
                  >Área de consulta</label
                >
                <textarea
                  class="form-control resize"
                  id="consulta"
                  rows="5"
                  placeholder="Ingrese su consulta aqui"
                  minlength="1"
                  maxlength="400"
                  required
                ></textarea>
              </div>
              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="exampleCheck1"
                />
                <label class="form-check-label" for="exampleCheck1"
                  >Estoy de acuerdo con los términos y condiciones</label
                >
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 bg-secondary border-0"
              >
                Enviar consulta
              </button>
            </form>
          </div>
          <div class="col-12 col-md-6">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1780.0529818770297!2d-65.20797027913011!3d-26.83658180447303!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses-419!2sar!4v1771624464510!5m2!1ses-419!2sar"
              class="w-100"
              width="600"
              height="365"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-black py-3">
      <div class="container">
        <div class="row">
          <div class="col-12 col-md-4 text-center mb-4 mb-md-0">
            <img src="../img/LOGO-TU-BLOG-BLACO.jpg" alt="log-tu-blog" />
          </div>
          <div
            class="col-12 col-md-4 d-flex justify-content-center align-items-center gap-3 fs-1 mb-4 mb-md-0"
          >
            <a href="./error-404.html" class="text-secondary"
              ><i class="bi bi-facebook"></i
            ></a>
            <a href="./error-404.html" class="text-secondary"
              ><i class="bi bi-instagram"></i
            ></a>
            <a href="./error-404.html" class="text-secondary"
              ><i class="bi bi-twitch"></i
            ></a>
          </div>
          <div class="col-12 col-md-4 d-flex row text-center ms-1">
            <a href="./error-404.html" class="text-secondary"
              >Ultimas Noticias</a
            >
            <a href="./error-404.html" class="text-secondary">Sobre Nosotros</a>
            <a href="./error-404.html" class="text-secondary">Contacto</a>
          </div>
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
